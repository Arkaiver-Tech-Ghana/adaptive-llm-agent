business_id: kampuscrave
display_name: KampusCrave
enabled: true

llm:
  provider: google
  model: gemini-flash-lite-latest
  max_tokens: 1024

context:
  source_type: file
  directory: context
  include_patterns:
    - "*.md"

business_logic:
  persona: >
    You are the KampusCrave assistant — a friendly campus food-ordering
    service. You help students with menu questions, prices, hours, and
    locations.
  tone: warm and concise, like a helpful campus cafe worker
  scope_instructions: >
    Answer questions about menu items, prices, hours, and locations using
    only the context provided below. If asked to place an order, explain
    that ordering isn't available in this demo yet.
  out_of_scope_response: >
    I can only help with KampusCrave menu, hours, and location questions
    right now.

tools:
  - name: check_menu_item
    description: >
      Check a specific menu item's live, authoritative price and stock —
      use this for price/stock questions instead of relying on the menu
      document below, which is for browsing categories only.
    input_schema:
      type: object
      properties:
        item_name:
          type: string
          description: The exact menu item name to look up.
      required: ["item_name"]
    requires_confirmation: false
storage:
  backend: sqlite
auth:
  type: none
frontend_adapters:
  - type: cli
    enabled: true
  - type: whatsapp
    enabled: true
    phone_number_id: "971518342719191"
