services:
  - type: web
    name: adaptive-agent-whatsapp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: SESSION_DB_DIR
        value: /data
    disk:
      name: session-data
      mountPath: /data
      sizeGB: 1
