[project]
name = "adaptive-agent"
version = "0.1.0"
description = "Single agent core, wrapped by NeMo Guardrails, serving multiple businesses off one config-driven codebase."
readme = "README.md"
authors = [
    { name = "Ramsey Root", email = "ramseygborgla@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "anthropic>=0.68",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "nemoguardrails>=0.23.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    # Pinned below 4.0: langchain-google-genai>=4.0 forwards NeMo's
    # OpenAI-style `max_tokens` self-check kwarg straight into
    # google.genai.types.GenerateContentConfig, which rejects it
    # (extra_forbidden — it only recognizes max_output_tokens). 2.x/3.x
    # predate that regression; verified working through 3.2.0. See
    # nemo_rails/config.yml's comment for the full story.
    "langchain-google-genai>=2.1.12,<4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
]

[project.scripts]
adaptive-agent-cli = "adaptive_agent.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits a real LLM API; requires the API key matching the Business Config's llm.provider (ANTHROPIC_API_KEY or GOOGLE_API_KEY)",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
